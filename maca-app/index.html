<!DOCTYPE html>
<html lang="zh-Hant-MO">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#DB618A">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="暢遊澳門街">
  <meta name="description" content="暢遊澳門街（MACA）— 按個人喜好選擇主題路線，漫步澳門的歷史、綠地、文化與美食。">
  <title>暢遊澳門街</title>
  <link rel="icon" href="img/logo.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Ma+Shan+Zheng&family=Noto+Sans+TC:wght@400;500;700&family=ZCOOL+KuaiLe&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="stage" id="stage">
    <div class="device" id="device">
      <div class="app" id="app"></div>
      <nav class="bottom-nav" id="nav" hidden>
        <button type="button" data-act="back" aria-label="回上一頁">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 5 L8 12 L15 19"/></svg>
        </button>
        <span class="divider"></span>
        <button type="button" data-act="news" aria-label="最新推介">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" aria-hidden="true">
            <path d="M12 3 v4 M12 17 v4 M3 12 h4 M17 12 h4 M6 6 l2.4 2.4 M15.6 15.6 L18 18 M18 6 l-2.4 2.4 M8.4 15.6 L6 18"/>
            <circle cx="12" cy="12" r="2.2" fill="currentColor" stroke="none"/>
          </svg>
        </button>
        <span class="divider"></span>
        <button type="button" data-act="plan" aria-label="路線規劃">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" aria-hidden="true">
            <circle cx="6" cy="7" r="2.1" fill="currentColor" stroke="none"/>
            <circle cx="15" cy="11" r="2.1" fill="currentColor" stroke="none"/>
            <circle cx="9" cy="18" r="2.1" fill="currentColor" stroke="none"/>
            <path d="M7.6 8.4 L13.4 10.2 M13.6 12.8 L10.4 16.2"/>
          </svg>
        </button>
        <span class="divider"></span>
        <button type="button" data-act="fav" aria-label="我的收藏">
          <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
            <path d="M12 20s-6.5-4.2-8.8-8.1C1.4 8.7 3.1 5.5 6.2 5.2c1.7-.2 3.3.7 4.2 2.1 1-1.4 2.5-2.3 4.2-2.1 3.1.3 4.8 3.5 3 6.7C18.5 15.8 12 20 12 20z"/>
          </svg>
        </button>
      </nav>
      <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="圖片放大">
        <button type="button" class="close" id="lightbox-close" aria-label="關閉">
          <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" aria-hidden="true"><path d="M6 6 L18 18 M18 6 L6 18"/></svg>
        </button>
        <img id="lightbox-img" alt="">
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
  <script src="js/data.js"></script>
  <script src="js/app.js"></script>
</body>
</html>

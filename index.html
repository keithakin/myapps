<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Keith · Apps</title>
  <meta name="description" content="澳門日常小工具：消費券記錄、圖片轉場、Tabata 計時器" />
  <meta name="theme-color" content="#f7f6f3" />
  <style>
    :root {
      --bg: #f7f6f3;
      --surface: #ffffff;
      --ink: #1c1c1a;
      --muted: #6b6a66;
      --line: rgba(28, 28, 26, 0.08);
      --shadow: 0 1px 2px rgba(28, 28, 26, 0.04), 0 8px 24px rgba(28, 28, 26, 0.06);
      --shadow-hover: 0 4px 8px rgba(28, 28, 26, 0.05), 0 16px 40px rgba(28, 28, 26, 0.1);
      --radius: 18px;
      --ease: cubic-bezier(0.22, 1, 0.36, 1);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { -webkit-text-size-adjust: 100%; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Helvetica Neue",
        "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", sans-serif;
      background: var(--bg);
      color: var(--ink);
      line-height: 1.55;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
    }

    .wrap {
      width: min(1080px, calc(100% - 2.5rem));
      margin: 0 auto;
      padding: 3.5rem 0 4rem;
    }

    header {
      margin-bottom: 2.75rem;
      max-width: 36rem;
    }

    .eyebrow {
      display: inline-block;
      font-size: 0.72rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--muted);
      margin-bottom: 0.85rem;
      font-weight: 500;
    }

    h1 {
      font-size: clamp(1.85rem, 4vw, 2.35rem);
      font-weight: 600;
      letter-spacing: -0.03em;
      line-height: 1.2;
      margin-bottom: 0.65rem;
    }

    .intro {
      color: var(--muted);
      font-size: 1.02rem;
      font-weight: 400;
      max-width: 28rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 1.25rem;
    }

    a.card {
      display: flex;
      flex-direction: column;
      background: var(--surface);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      overflow: hidden;
      text-decoration: none;
      color: inherit;
      box-shadow: var(--shadow);
      transition: transform 0.35s var(--ease), box-shadow 0.35s var(--ease), border-color 0.35s var(--ease);
      height: 100%;
    }

    a.card:hover,
    a.card:focus-visible {
      transform: translateY(-4px);
      box-shadow: var(--shadow-hover);
      border-color: rgba(28, 28, 26, 0.12);
      outline: none;
    }

    a.card:focus-visible {
      box-shadow: var(--shadow-hover), 0 0 0 3px rgba(28, 28, 26, 0.12);
    }

    .thumb {
      aspect-ratio: 16 / 10;
      background: #ebeae6;
      overflow: hidden;
      position: relative;
    }

    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      object-position: top center;
      display: block;
      transition: transform 0.5s var(--ease);
    }

    a.card:hover .thumb img {
      transform: scale(1.03);
    }

    .body {
      padding: 1.15rem 1.2rem 1.35rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex: 1;
    }

    .body h2 {
      font-size: 1.05rem;
      font-weight: 600;
      letter-spacing: -0.02em;
      line-height: 1.3;
    }

    .body p {
      font-size: 0.88rem;
      color: var(--muted);
      line-height: 1.55;
    }

    .open {
      margin-top: auto;
      padding-top: 0.85rem;
      font-size: 0.78rem;
      color: var(--ink);
      letter-spacing: 0.02em;
      opacity: 0.55;
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
      transition: opacity 0.25s var(--ease), gap 0.25s var(--ease);
    }

    a.card:hover .open {
      opacity: 0.9;
      gap: 0.55rem;
    }

    footer {
      margin-top: 3.5rem;
      padding-top: 1.5rem;
      border-top: 1px solid var(--line);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 1rem;
      flex-wrap: wrap;
    }

    footer p,
    footer a {
      font-size: 0.78rem;
      color: var(--muted);
      text-decoration: none;
    }

    footer a:hover {
      color: var(--ink);
    }

    @media (max-width: 900px) {
      .grid {
        grid-template-columns: 1fr;
        gap: 1rem;
      }

      .wrap {
        width: min(560px, calc(100% - 2rem));
        padding: 2.5rem 0 3rem;
      }

      header { margin-bottom: 2rem; }
    }

    @media (min-width: 901px) and (max-width: 1024px) {
      .grid { gap: 1rem; }
      .wrap { width: min(960px, calc(100% - 2rem)); }
    }

    @media (prefers-reduced-motion: reduce) {
      a.card,
      a.card .thumb img,
      .open {
        transition: none;
      }
      a.card:hover { transform: none; }
      a.card:hover .thumb img { transform: none; }
    }
  </style>
</head>
<body>
  <div class="wrap">
    <header>
      <span class="eyebrow">Keith · Apps</span>
      <h1>我的小工具</h1>
      <p class="intro">幾個輕便的網頁工具，方便日常使用——消費券、圖片轉場、健身計時。</p>
    </header>

    <main class="grid" aria-label="應用列表">
      <a class="card" href="coupon.html">
        <div class="thumb">
          <img src="thumbs/coupon.png" alt="消費券記錄介面預覽" width="1200" height="750" loading="lazy" />
        </div>
        <div class="body">
          <h2>消費券記錄</h2>
          <p>追蹤澳門五平台消費獎賞（MPay／中銀／支付寶／大豐／國際），標記已用／未用，星期五自動歸零。</p>
          <span class="open">開啟 <span aria-hidden="true">→</span></span>
        </div>
      </a>

      <a class="card" href="slideshow.html">
        <div class="thumb">
          <img src="thumbs/slideshow.png" alt="圖片轉場動畫介面預覽" width="1200" height="750" loading="lazy" />
        </div>
        <div class="body">
          <h2>圖片轉場動畫</h2>
          <p>上載圖片、選擇轉場／停留／畫布尺寸，預覽後匯出 MP4 幻燈片。</p>
          <span class="open">開啟 <span aria-hidden="true">→</span></span>
        </div>
      </a>

      <a class="card" href="tabata.html">
        <div class="thumb">
          <img src="thumbs/tabata.png" alt="Tabata 健身計時器介面預覽" width="1200" height="750" loading="lazy" />
        </div>
        <div class="body">
          <h2>Tabata &amp; HIIT 計時器</h2>
          <p>可調運動／休息／組數，隨機動作清單，螢幕常亮與提示音，專心練一輪。</p>
          <span class="open">開啟 <span aria-hidden="true">→</span></span>
        </div>
      </a>
    </main>

    <footer>
      <p>純靜態頁面 · 可離線使用</p>
      <a href="https://github.com/keithakin/myapps" rel="noopener noreferrer">keithakin</a>
    </footer>
  </div>
</body>
</html>

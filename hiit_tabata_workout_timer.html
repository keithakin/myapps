<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#0f172a">
  <title>Tabata & HIIT 健身計時器</title>
  <!-- Tailwind CSS via CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,600;0,700;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    .font-timer {
      font-family: 'Chakra Petch', monospace, sans-serif;
    }
    /* Pulse glow effects */
    .glow-gold { box-shadow: 0 0 25px rgba(245, 158, 11, 0.45); }
    .glow-teal { box-shadow: 0 0 25px rgba(20, 184, 166, 0.45); }
    .glow-pink { box-shadow: 0 0 25px rgba(236, 72, 153, 0.45); }
    .glow-coral { box-shadow: 0 0 25px rgba(244, 63, 94, 0.45); }
    
    /* Touch target transitions */
    .btn-press:active {
      transform: scale(0.95);
    }
    /* Scrollbar hide */
    ::-webkit-scrollbar {
      display: none;
    }
  </style>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col justify-between pb-6 safe-area-inset">

  <header class="w-full px-5 pt-4 pb-2 flex items-center justify-between border-b border-slate-800/80">
    <div class="flex items-center space-x-2">
      <span class="w-3 h-3 rounded-full bg-emerald-500 animate-ping"></span>
      <h1 class="font-bold text-lg tracking-wide text-white">TABATA <span class="text-teal-400 text-sm">PRO</span></h1>
    </div>
    <div class="flex items-center space-x-2">
      <!-- Screen wake indicator -->
      <span id="wakeLockBadge" class="text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-medium transition-colors">
        螢幕常亮: 關閉
      </span>
      <!-- Sound toggle button -->
      <button id="soundToggleBtn" class="p-2 text-slate-300 hover:text-white bg-slate-800 rounded-lg text-sm">
        🔊
      </button>
    </div>
  </header>

  <main class="w-full max-w-md mx-auto px-4 flex-1 flex flex-col justify-around py-3">

    <!-- Primary Timer Card -->
    <div id="displayCard" class="relative overflow-hidden w-full rounded-3xl bg-slate-900 border border-slate-800 p-6 flex flex-col items-center justify-center transition-all duration-500 shadow-2xl">
      <!-- Status Badge -->
      <div id="statusTag" class="px-5 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest text-amber-300 bg-amber-500/20 mb-1 border border-amber-500/30">
        準備中 (READY)
      </div>

      <!-- Main Count Display -->
      <div class="relative w-56 h-56 flex items-center justify-center my-1">
        <!-- SVG Progress Ring -->
        <svg class="w-full h-full transform -rotate-90" viewBox="0 0 100 100">
          <circle cx="50" cy="50" r="44" stroke="currentColor" stroke-width="7" class="text-slate-800 fill-none" />
          <circle id="progressCircle" cx="50" cy="50" r="44" stroke="currentColor" stroke-width="7" stroke-dasharray="276.46" stroke-dashoffset="0" stroke-linecap="round" class="text-amber-400 fill-none transition-all duration-300" />
        </svg>
        
        <!-- Timer Inner text -->
        <div class="absolute inset-0 flex flex-col items-center justify-center text-center">
          <span id="timerText" class="font-timer text-7xl font-bold tracking-tight text-white leading-none">3</span>
          <span id="subLabel" class="text-xs text-slate-400 mt-1 uppercase tracking-wider">秒數</span>
        </div>
      </div>

      <!-- Current Round / Total and Exercise -->
      <div class="w-full flex items-center justify-between pt-2 border-t border-slate-800/80 text-sm">
        <div class="text-slate-400">回合：<span id="roundCurrent" class="text-white font-bold text-lg font-timer">1</span> / <span id="roundTotal" class="text-slate-300 font-semibold font-timer">8</span></div>
        <div class="text-right">
          <span class="text-xs text-slate-400 block">目前動作</span>
          <span id="currentActionName" class="font-semibold text-teal-300 text-sm truncate max-w-[140px] inline-block">--</span>
        </div>
      </div>
    </div>

    <div class="w-full bg-slate-900/80 backdrop-blur rounded-2xl p-3.5 border border-slate-800/80 my-2">
      <div class="grid grid-cols-3 gap-2 text-center">
        <!-- Workout Seconds -->
        <div class="bg-slate-800/60 rounded-xl p-2 flex flex-col items-center">
          <span class="text-[11px] text-teal-400 font-semibold tracking-wide">運動 (秒)</span>
          <div class="flex items-center space-x-1 mt-1">
            <button onclick="adjustSetting('work', -5)" class="text-slate-400 hover:text-white w-6 h-6 rounded bg-slate-700/60 btn-press">-</button>
            <input type="number" id="worktime" value="20" min="5" max="300" class="w-10 bg-transparent text-center font-timer font-bold text-lg text-white focus:outline-none" />
            <button onclick="adjustSetting('work', 5)" class="text-slate-400 hover:text-white w-6 h-6 rounded bg-slate-700/60 btn-press">+</button>
          </div>
        </div>
        <!-- Rest Seconds -->
        <div class="bg-slate-800/60 rounded-xl p-2 flex flex-col items-center">
          <span class="text-[11px] text-pink-400 font-semibold tracking-wide">休息 (秒)</span>
          <div class="flex items-center space-x-1 mt-1">
            <button onclick="adjustSetting('rest', -5)" class="text-slate-400 hover:text-white w-6 h-6 rounded bg-slate-700/60 btn-press">-</button>
            <input type="number" id="resttime" value="10" min="0" max="300" class="w-10 bg-transparent text-center font-timer font-bold text-lg text-white focus:outline-none" />
            <button onclick="adjustSetting('rest', 5)" class="text-slate-400 hover:text-white w-6 h-6 rounded bg-slate-700/60 btn-press">+</button>
          </div>
        </div>
        <!-- Rounds Count -->
        <div class="bg-slate-800/60 rounded-xl p-2 flex flex-col items-center">
          <span class="text-[11px] text-amber-400 font-semibold tracking-wide">組數 (輪)</span>
          <div class="flex items-center space-x-1 mt-1">
            <button onclick="adjustSetting('round', -1)" class="text-slate-400 hover:text-white w-6 h-6 rounded bg-slate-700/60 btn-press">-</button>
            <input type="number" id="round" value="8" min="1" max="99" class="w-10 bg-transparent text-center font-timer font-bold text-lg text-white focus:outline-none" />
            <button onclick="adjustSetting('round', 1)" class="text-slate-400 hover:text-white w-6 h-6 rounded bg-slate-700/60 btn-press">+</button>
          </div>
        </div>
      </div>
    </div>

    <div class="w-full">
      <div class="flex items-center justify-between mb-1.5 px-1">
        <span class="text-xs font-semibold text-slate-400 tracking-wider">今日動作清單 (點擊可更換)</span>
        <button id="rerollAllBtn" class="text-xs text-teal-400 hover:text-teal-300 font-medium flex items-center gap-1 btn-press">
          🔄 隨機換新
        </button>
      </div>

      <div class="grid grid-cols-2 gap-2" id="routineList">
        <!-- 4 exercise slots will be rendered dynamically -->
      </div>
    </div>

  </main>

  <footer class="w-full max-w-md mx-auto px-4 mt-2">
    <div class="grid grid-cols-3 gap-3">
      <!-- Reset Button -->
      <button id="resetBtn" class="btn-press py-3.5 bg-slate-800 hover:bg-slate-700 text-slate-200 font-bold rounded-2xl flex flex-col items-center justify-center transition-all border border-slate-700/60">
        <span class="text-lg">↺</span>
        <span class="text-xs mt-0.5">重置</span>
      </button>

      <!-- Start Button -->
      <button id="startBtn" class="btn-press py-3.5 bg-emerald-500 hover:bg-emerald-400 active:bg-emerald-600 text-slate-950 font-bold rounded-2xl flex flex-col items-center justify-center transition-all shadow-lg shadow-emerald-500/25">
        <span class="text-lg">▶</span>
        <span class="text-xs mt-0.5">開始</span>
      </button>

      <!-- Pause / Stop Button -->
      <button id="stopBtn" class="btn-press py-3.5 bg-rose-600/90 hover:bg-rose-500 active:bg-rose-700 text-white font-bold rounded-2xl flex flex-col items-center justify-center transition-all shadow-lg shadow-rose-600/20">
        <span class="text-lg">⏸</span>
        <span class="text-xs mt-0.5">暫停</span>
      </button>
    </div>
  </footer>

  <!-- Audio tags retained as optional / fallback -->
  <audio id="sound" preload="none"></audio>
  <audio id="good" preload="none"></audio>

  <script>
    // Preset Exercise pool
    const ALL_EXERCISES = [
      { name: "開合跳 (Jumping Jacks)", cat: "有氧" },
      { name: "深蹲 (Squats)", cat: "下肢" },
      { name: "伏地挺身 (Pushups)", cat: "上肢" },
      { name: "手肘平板支撐 (Elbow Plank)", cat: "核心" },
      { name: "登山者 (Mountain Climber)", cat: "核心" },
      { name: "捲腹 (Crunches)", cat: "核心" },
      { name: "靠牆伏地挺身 (Wall Press)", cat: "上肢" },
      { name: "原地無繩跳繩 (Air Jump Rope)", cat: "有氧" },
      { name: "反向捲腹 (Reverse Crunch)", cat: "核心" },
      { name: "臀橋 (Floor Bridges)", cat: "臀腿" },
      { name: "跪姿伏地挺身 (Kneeling Pushups)", cat: "上肢" },
      { name: "V字收腹 (V-Up)", cat: "核心" },
      { name: "弓箭步 (Lunges)", cat: "下肢" },
      { name: "跳躍弓箭步 (Jump Lunges)", cat: "爆發力" },
      { name: "平板支撐切換 (Plank Pushups)", cat: "全身" },
      { name: "踏台階 (Step Ups)", cat: "下肢" },
      { name: "板凳撐體 (Bench Dips)", cat: "手臂" },
      { name: "高抬腿 (High Knees)", cat: "有氧" },
      { name: "側平板抬臀 (Side Plank)", cat: "核心" },
      { name: "後踢臀跑 (Butt Kicks)", cat: "有氧" },
      { name: "尺蠖爬行 (Inching Plank)", cat: "核心" },
      { name: "超人伸展 (Back Extension)", cat: "背部" },
      { name: "跳躍深蹲 (Jump Squats)", cat: "爆發力" },
      { name: "波比跳 (Burpees)", cat: "全身" }
    ];

    let selectedExercises = [];
    let timerInterval = null;
    let isRunning = false;
    let isSoundEnabled = true;
    let wakeLock = null;

    // States: 3 = Ready, 0 = Work, 1 = Rest, 2 = Finished
    let channel = 3;
    let currentTime = 3;
    let totalPhaseTime = 3;
    let currentRound = 1;

    // Web Audio Synthesizer (Works perfectly offline and standalone on mobile)
    let audioCtx = null;

    function getAudioContext() {
      if (!audioCtx) {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (AudioContextClass) {
          audioCtx = new AudioContextClass();
        }
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      return audioCtx;
    }

    function playBeep(frequency = 600, duration = 0.15, type = 'sine') {
      if (!isSoundEnabled) return;
      try {
        const ctx = getAudioContext();
        if (!ctx) return;
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = type;
        osc.frequency.setValueAtTime(frequency, ctx.currentTime);
        gain.gain.setValueAtTime(0.2, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + duration);
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + duration);
      } catch (e) {
        console.warn("Audio playback error:", e);
      }
    }

    function playTripleBeep() {
      playBeep(520, 0.12, 'square');
      setTimeout(() => playBeep(520, 0.12, 'square'), 180);
      setTimeout(() => playBeep(880, 0.35, 'square'), 360);
    }

    function playFinishCheer() {
      // Fanfare chord sound
      [523.25, 659.25, 783.99, 1046.50].forEach((freq, idx) => {
        setTimeout(() => playBeep(freq, 0.45, 'triangle'), idx * 100);
      });
    }

    async function requestWakeLock() {
      try {
        if ('wakeLock' in navigator) {
          wakeLock = await navigator.wakeLock.request('screen');
          document.getElementById('wakeLockBadge').textContent = '螢幕常亮: 開啟';
          document.getElementById('wakeLockBadge').className = 'text-xs px-2.5 py-1 rounded-full bg-emerald-900/60 text-emerald-300 font-medium border border-emerald-700/50';
          
          wakeLock.addEventListener('release', () => {
            document.getElementById('wakeLockBadge').textContent = '螢幕常亮: 關閉';
            document.getElementById('wakeLockBadge').className = 'text-xs px-2.5 py-1 rounded-full bg-slate-800 text-slate-400 font-medium';
          });
        }
      } catch (err) {
        console.warn('Wake Lock request error:', err);
      }
    }

    function releaseWakeLock() {
      if (wakeLock !== null) {
        wakeLock.release().catch(() => {});
        wakeLock = null;
      }
    }

    // Re-acquire wake lock on visibilitychange
    document.addEventListener('visibilitychange', async () => {
      if (wakeLock !== null && document.visibilityState === 'visible' && isRunning) {
        await requestWakeLock();
      }
    });

    function rollRandomExercises() {
      const shuffled = [...ALL_EXERCISES].sort(() => 0.5 - Math.random());
      selectedExercises = shuffled.slice(0, 4);
      renderRoutineList();
    }

    function swapSingleExercise(index) {
      if (isRunning) return;
      const currentNames = selectedExercises.map(e => e.name);
      const candidates = ALL_EXERCISES.filter(e => !currentNames.includes(e.name));
      const pick = candidates[Math.floor(Math.random() * candidates.length)];
      if (pick) {
        selectedExercises[index] = pick;
        renderRoutineList();
        updateDisplay();
      }
    }

    function renderRoutineList() {
      const container = document.getElementById('routineList');
      container.innerHTML = '';

      const activeIndex = (currentRound - 1) % 4;

      selectedExercises.forEach((item, idx) => {
        const isActive = (channel === 0 && activeIndex === idx);
        const card = document.createElement('div');
        card.className = `p-2.5 rounded-xl border text-left transition-all relative flex flex-col justify-between cursor-pointer btn-press ${
          isActive 
            ? 'bg-teal-950/70 border-teal-400 text-teal-200 ring-2 ring-teal-500/30 glow-teal' 
            : 'bg-slate-900/90 border-slate-800/80 text-slate-300 hover:border-slate-700'
        }`;

        card.innerHTML = `
          <div class="flex items-center justify-between text-[11px] mb-1">
            <span class="font-bold px-1.5 py-0.5 rounded ${isActive ? 'bg-teal-500 text-slate-950' : 'bg-slate-800 text-slate-400'}">#${idx + 1}</span>
            <span class="text-slate-400 text-[10px]">${item.cat}</span>
          </div>
          <p class="font-semibold text-xs leading-snug line-clamp-2">${item.name}</p>
          <div class="mt-1 flex items-center justify-between text-[10px] text-slate-400">
            <span>${isActive ? '🔥 進行中' : '點擊換動作'}</span>
            <span>⇄</span>
          </div>
        `;
        card.onclick = () => swapSingleExercise(idx);
        container.appendChild(card);
      });
    }

    function updateDisplay() {
      const timerText = document.getElementById('timerText');
      const statusTag = document.getElementById('statusTag');
      const displayCard = document.getElementById('displayCard');
      const progressCircle = document.getElementById('progressCircle');
      const currentActionName = document.getElementById('currentActionName');
      const roundCurrent = document.getElementById('roundCurrent');
      const roundTotal = document.getElementById('roundTotal');

      const totalRounds = parseInt(document.getElementById('round').value) || 8;
      roundTotal.textContent = totalRounds;
      roundCurrent.textContent = Math.min(currentRound, totalRounds);

      const activeIdx = (currentRound - 1) % 4;
      currentActionName.textContent = selectedExercises[activeIdx]?.name || '自主動作';

      timerText.textContent = currentTime;

      // SVG Ring circumference = 2 * PI * 44 ≈ 276.46
      const circumference = 276.46;
      let ratio = 0;
      if (totalPhaseTime > 0) {
        ratio = Math.max(0, Math.min(1, currentTime / totalPhaseTime));
      }
      const offset = circumference * (1 - ratio);
      progressCircle.style.strokeDashoffset = offset;

      // Clean old classes
      displayCard.classList.remove('glow-gold', 'glow-teal', 'glow-pink', 'glow-coral');
      progressCircle.classList.remove('text-amber-400', 'text-teal-400', 'text-pink-500', 'text-rose-500');

      if (channel === 3) { // READY
        statusTag.textContent = '準備中 (READY)';
        statusTag.className = 'px-5 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest text-amber-300 bg-amber-500/20 mb-1 border border-amber-500/30';
        progressCircle.classList.add('text-amber-400');
        displayCard.classList.add('glow-gold');
      } else if (channel === 0) { // WORK
        statusTag.textContent = '運動 (WORK)';
        statusTag.className = 'px-5 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest text-teal-300 bg-teal-500/20 mb-1 border border-teal-500/30 animate-pulse';
        progressCircle.classList.add('text-teal-400');
        displayCard.classList.add('glow-teal');
      } else if (channel === 1) { // REST
        statusTag.textContent = '休息 (REST)';
        statusTag.className = 'px-5 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest text-pink-300 bg-pink-500/20 mb-1 border border-pink-500/30';
        progressCircle.classList.add('text-pink-500');
        displayCard.classList.add('glow-pink');
      } else if (channel === 2) { // FINISHED
        statusTag.textContent = '完成！(FINISHED)';
        statusTag.className = 'px-5 py-1.5 rounded-full text-xs font-bold uppercase tracking-widest text-rose-300 bg-rose-500/20 mb-1 border border-rose-500/30';
        progressCircle.classList.add('text-rose-500');
        displayCard.classList.add('glow-coral');
        timerText.textContent = 'DONE';
      }

      renderRoutineList();
    }

    function timerTick() {
      const maxRounds = parseInt(document.getElementById('round').value) || 8;
      const workSec = parseInt(document.getElementById('worktime').value) || 20;
      const restSec = parseInt(document.getElementById('resttime').value) || 10;

      if (currentRound > maxRounds) {
        finishRoutine();
        return;
      }

      // Audio beeps on 3, 2, 1
      if (currentTime <= 3 && currentTime > 0) {
        playBeep(700, 0.1);
      }

      if (currentTime > 0) {
        currentTime--;
      } else {
        // State transition when reaching 0
        if (channel === 3) {
          // READY -> WORK
          channel = 0;
          totalPhaseTime = workSec;
          currentTime = workSec;
          playTripleBeep();
        } else if (channel === 0) {
          // WORK -> REST or FINISH
          if (currentRound >= maxRounds) {
            finishRoutine();
            return;
          }
          channel = 1;
          totalPhaseTime = restSec;
          currentTime = restSec;
          playTripleBeep();
        } else if (channel === 1) {
          // REST -> WORK (Next round)
          currentRound++;
          channel = 0;
          totalPhaseTime = workSec;
          currentTime = workSec;
          playTripleBeep();
        }
      }

      updateDisplay();
    }

    function startTimer() {
      if (isRunning) return;
      getAudioContext(); // Unlock audio context on user interaction
      requestWakeLock();

      isRunning = true;
      document.getElementById('startBtn').classList.add('opacity-50', 'pointer-events-none');
      document.getElementById('stopBtn').classList.remove('opacity-50', 'pointer-events-none');

      timerInterval = setInterval(timerTick, 1000);
    }

    function stopTimer() {
      if (!isRunning) return;
      isRunning = false;
      clearInterval(timerInterval);
      releaseWakeLock();

      document.getElementById('startBtn').classList.remove('opacity-50', 'pointer-events-none');
    }

    function resetTimer() {
      stopTimer();
      channel = 3;
      currentTime = 3;
      totalPhaseTime = 3;
      currentRound = 1;
      updateDisplay();
    }

    function finishRoutine() {
      stopTimer();
      channel = 2;
      playFinishCheer();
      updateDisplay();
    }

    function adjustSetting(key, delta) {
      if (isRunning) return;
      const el = document.getElementById(key === 'work' ? 'worktime' : key === 'rest' ? 'resttime' : 'round');
      let val = parseInt(el.value) + delta;
      if (key === 'round') val = Math.max(1, Math.min(val, 99));
      else val = Math.max(5, Math.min(val, 300));
      el.value = val;
      updateDisplay();
    }

    window.addEventListener('DOMContentLoaded', () => {
      rollRandomExercises();
      updateDisplay();

      document.getElementById('startBtn').addEventListener('click', startTimer);
      document.getElementById('stopBtn').addEventListener('click', stopTimer);
      document.getElementById('resetBtn').addEventListener('click', resetTimer);
      document.getElementById('rerollAllBtn').addEventListener('click', () => {
        if (!isRunning) rollRandomExercises();
      });

      // Sound toggle
      const soundBtn = document.getElementById('soundToggleBtn');
      soundBtn.addEventListener('click', () => {
        isSoundEnabled = !isSoundEnabled;
        soundBtn.textContent = isSoundEnabled ? '🔊' : '🔇';
      });

      // Inputs change listeners
      ['worktime', 'resttime', 'round'].forEach(id => {
        document.getElementById(id).addEventListener('change', updateDisplay);
      });
    });
  </script>
</body>
</html>
